name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check formatting
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) { $unformatted; exit 1 }
        shell: pwsh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
      - name: Build
        run: go build -v ./cmd/hellokit
